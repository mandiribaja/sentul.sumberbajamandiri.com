  [[params.projects]]
    name = "Pengadaan Material Baja untuk Kanopi dan Rangka Bangunan"
    location = "Citeureup, Kabupaten Bogor"
    year = "2026"
    description = "Penyediaan hollow, besi siku, dan material baja pendukung untuk kebutuhan rangka kanopi dan bangunan di wilayah Citeureup."

  [params.services]
    items = [
      "Informasi dan pemesanan besi beton polos dan ulir, wiremesh, hollow, bondek, pipa, besi siku, dan baja profil",
