    profileImage = "/images/logo-sbm-512x512-a.png"
    bio = "Sumber Baja Mandiri Sentul melayani kebutuhan besi dan baja untuk proyek konstruksi dan renovasi di Sentul, Babakan Madang, Sukaraja, Citeureup, Cibinong, dan sekitarnya di Kabupaten Bogor. Tersedia informasi besi beton polos dan ulir, wiremesh, hollow, bondek, pipa, besi siku, serta baja profil. Hubungi kami untuk menanyakan harga dan ketersediaan stok."

