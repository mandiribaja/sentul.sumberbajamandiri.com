    nameuser = "Sumber Baja Mandiri Sentul"
    jobuser = "Penyedia Besi dan Baja untuk Wilayah Sentul dan Sekitarnya"
    phoneuser = "0821-2549-8008"
    emailuser = "sumberbajamandiribogor@gmail.com"
    addressuser = "Dekat Lula Kost, Jl. Pahlawan, RT.4/RW.6, Leuwinutug, Kec. Citeureup, Kabupaten Bogor, Jawa Barat 16810"
