# Domain: pastikan benar (nama folder project tertulis "sumberbajamanidri" - kemungkinan typo).
baseURL = "https://sentul.sumberbajamandiri.com"
languageCode = "id"
defaultContentLanguage = "id"
title = "Sumber Baja Mandiri Sentul | Besi dan Baja di Sentul, Babakan Madang, Sukaraja, dan Citeureup"
theme = "hugo-bangunan"
summaryLength = "35"
paginate = "12"

# Folder content/<folder>/ sudah menjadi section sendiri, jadi halaman /tags/ dan /categories/
# otomatis tidak diperlukan. Hapus baris ini jika ingin mengaktifkannya.
disableKinds = ["taxonomy", "term"]

# Hugo >= 0.128 memakai [pagination]; `paginate` di atas untuk Hugo lama.
[pagination]
  pagerSize = 12

# Beranda juga menghasilkan /index.json (indeks untuk halaman pencarian /cari/). RSS beranda dimatikan
# karena akan memuat ratusan artikel.
[outputs]
  home = ["HTML", "JSON"]

[params]
    name = "Sumber Baja Mandiri Sentul"
    description = "Besi dan Baja untuk Proyek Konstruksi di Sentul dan Sekitarnya, Kabupaten Bogor"

    # ---- Kontak Sentul: lengkapi dengan nomor dan alamat resmi sebelum deploy ----
    email = "sumberbajamandiribogor@gmail.com"   # email pusat; ganti jika Sentul punya email sendiri
    phone = "0821-2549-8008"
    telepon = "//+6282125498008"
    whatsapp = "//api.whatsapp.com/send?phone=6282125498008&text=Halo%20Sumber%20Baja%20Mandiri%20Sentul"
    address = "Dekat Lula Kost, Jl. Pahlawan, RT.4/RW.6, Leuwinutug, Kec. Citeureup, Kabupaten Bogor, Jawa Barat 16810"
    year = 2026
    DateForm = "2 January 2006"
    author = "Sentul"

    # ---- Gambar (path tanpa awalan "/", relatif terhadap folder static) ----
    avatar = "/images/logo-sbm-512x512-a.png"
    avatarclass = "circle"
    background = "/images/sumberbajamandiri-bg.png"
    banner = "images/sumberbajamandiri-bg.png"   # gambar header (kosong = header gradasi biru)
