    logo = "images/sbm-logo.png"
    logoclass = "icon float-left"
    defaultImage = "/images/logo-sbm-512x512-a.png"   # gambar kartu bila artikel tidak punya gambar

    # ---- Fitur ----
    tocMinWordCount = 500
    showSubheader = true
    showRecentWorks = true
    enableNextPrevPages = true

    showFooterContact = true
    showFooterTextWidget = true
    enableWhatApps = true
    enableTelepon = true

    # Footer. Teks footer ada di folder i18n/ (root project).
    poweredBy = '<a href="https://sumberbajamandiri.com" rel="poweredby">Sumber Baja Mandiri</a>'

    # ---- Halaman Promo (/promo/) ----
    checkoutWa = "6282125498008"
    # promoEndDate = "2026-12-31T23:59:59"

    # ---- Halaman Profile (/profile/) ----
